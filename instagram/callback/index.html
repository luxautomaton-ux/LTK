<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Returning to Lux Codex</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #eef8ff; background: radial-gradient(circle at 20% 10%, #143d5a, transparent 35%), radial-gradient(circle at 80% 0%, #351b66, transparent 32%), #050a12; }
    main { width: min(620px, 100%); padding: 30px; border: 1px solid #5c789055; border-radius: 22px; background: #07111edb; box-shadow: 0 24px 80px #0008; }
    .kicker { display: block; margin-bottom: 9px; color: #6de7ff; font-size: 12px; font-weight: 800; letter-spacing: .15em; }
    h1 { margin: 0; font-size: clamp(30px, 7vw, 46px); line-height: 1; }
    p { margin: 14px 0 0; color: #b9c8d8; line-height: 1.55; }
    button { margin-top: 22px; padding: 11px 16px; border: 1px solid #65e7ff99; border-radius: 10px; color: #031018; background: #65e7ff; font: inherit; font-weight: 800; cursor: pointer; }
    button[hidden] { display: none; }
    .safe { margin-top: 18px; padding-top: 14px; border-top: 1px solid #5c789044; font-size: 12px; color: #8296aa; }
  </style>
</head>
<body>
  <main>
    <span class="kicker">LUX CODEX · INSTAGRAM LOGIN</span>
    <h1 id="title">Returning to Lux Codex…</h1>
    <p id="message">Your Instagram authorization is being handed back to the Social Media Studio.</p>
    <button id="return" type="button" hidden>Return to Lux Codex</button>
    <p class="safe">This page never receives or stores your Meta app secret or Instagram access token. It only relays the one-time authorization result back to the desktop app.</p>
  </main>
  <script>
    (() => {
      const source = new URLSearchParams(window.location.search);
      const code = (source.get("code") || "").trim();
      const state = (source.get("state") || "").trim();
      const error = (source.get("error") || "").trim();
      const errorDescription = (source.get("error_description") || error).trim();
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const button = document.getElementById("return");

      if (!state || (!code && !errorDescription)) {
        title.textContent = "Instagram return is incomplete";
        message.textContent = "The authorization response is missing its one-time state or result. Return to Lux Codex and start Connect Instagram again.";
        return;
      }

      const target = new URL("lux-hermes-candidate://social/instagram");
      target.searchParams.set("state", state);
      if (code) target.searchParams.set("code", code);
      if (error) target.searchParams.set("error", error);
      if (errorDescription) target.searchParams.set("error_description", errorDescription);

      const openCodex = () => { window.location.href = target.href; };
      button.hidden = false;
      button.addEventListener("click", openCodex);
      window.setTimeout(openCodex, 250);
      window.setTimeout(() => {
        title.textContent = "Finish in Lux Codex";
        message.textContent = "If Lux Codex did not open automatically, use the button below.";
      }, 1800);
    })();
  </script>
</body>
</html>
